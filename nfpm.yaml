# yaml-language-server: $schema=https://nfpm.goreleaser.com/static/schema.json
---
name: tedge-collectd-setup
arch: all
platform: linux
version: ${SEMVER}
section: misc
priority: optional
maintainer: Community <community@thin-edge.io>
description: thin-edge.io collectd setup
vendor: thin-edge.io
homepage: https://github.com/thin-edge/tedge-collectd-setup
license: Apache License 2.0
apk:
  # Use noarch instead of "all"
  arch: noarch
contents:
  - src: ./src/collectd.conf
    dst: /etc/collectd/collectd.conf
    type: config
    file_info:
      mode: 0644
      group: tedge
      owner: tedge
  - src: ./src/collectd
    dst: /etc/tedge/mappers/local/flows/collectd/
    file_info:
      mode: 0644
      group: tedge
      owner: tedge

overrides:
  apk:
    depends:
      - collectd
      - collectd-mqtt
      - tedge>=2.0.0
      - tedge-mapper>=2.0.0
    scripts:
      postinstall: src/packaging/postinstall
      postremove: src/packaging/postremove

  rpm:
    depends:
      - collectd
      - libmosquitto1
      - tedge >= 2.0.0
      - tedge-mapper >= 2.0.0
    scripts:
      postinstall: src/packaging/postinstall
      postremove: src/packaging/postremove

  deb:
    depends:
      - collectd-core
      - libmosquitto1
      - tedge (>= 2.0.0)
      - tedge-mapper (>= 2.0.0)
    scripts:
      postinstall: src/packaging/postinstall
      postremove: src/packaging/postremove
